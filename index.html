<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Nederlands leren</title>
<style>
:root{--bg:#f7f6f3;--fg:#1c1c1e;--mut:#8a8a8e;--card:#fff;--line:#e4e2dc;--acc:#2f4bd8;--ok:#2e8b57;--bad:#c8453b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--fg:#f2f2f4;--mut:#8e8e93;--card:#1c1c1f;--line:#2c2c30;--acc:#7b8dff;--ok:#4fbf82;--bad:#ef6b61}}
:root[data-theme="dark"]{--bg:#111113;--fg:#f2f2f4;--mut:#8e8e93;--card:#1c1c1f;--line:#2c2c30;--acc:#7b8dff;--ok:#4fbf82;--bad:#ef6b61}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Inter","Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:540px;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.top-right{display:flex;align-items:center;gap:10px}
#score{color:var(--mut);font-size:15px;font-weight:500}
.lang-select{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0}
nav button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 16px;display:flex;flex-direction:column;gap:18px}
.q{text-align:center}
.q small{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.q h2{font-size:36px;font-weight:600;margin:6px 0 2px;letter-spacing:-.02em}
.q p{margin:0;color:var(--mut);font-size:14px}
.listen{background:none;border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 8px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:52px}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--mut);flex-shrink:0}
.fb{text-align:center;min-height:60px}
.fb b{font-size:17px;font-weight:600}
.fb p{margin:2px 0 0;color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:500;cursor:pointer;text-align:center}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.end{text-align:center;display:flex;flex-direction:column;gap:12px}
.end h2{font-size:40px;margin:0 0 2px}
.end p{color:var(--mut);margin:0 0 12px;font-size:15px}
footer{text-align:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<main>
 <header>
   <h1>Nederlands leren</h1>
   <div class="top-right">
     <select id="langPicker" class="lang-select" onchange="changeLang(this.value)">
       <option value="uk">🇺🇦 UA</option>
       <option value="en">🇬🇧 EN</option>
       <option value="fr">🇫🇷 FR</option>
     </select>
     <span id="score"></span>
   </div>
 </header>
 <nav id="tabs"></nav>
 <div class="meta"><span id="prog"></span><span id="rnd"></span></div>
 <div class="bar"><i id="barfill"></i></div>
 <div class="card" id="card"></div>
 <footer id="footText">Нідерландська мова для всіх</footer>
</main>
<script>
var $=function(id){return document.getElementById(id)};
var PER_ROUND=10;
var userLang=localStorage.getItem("nl_lang")||"uk";
$("langPicker").value=userLang;

var UI={
 uk:{
  qProgress:"Питання",round:"Раунд",listen:"🔊 Слухати",next:"Далі",again:"Ще раз",
  nextTopic:"Наступна тема",accuracy:"точність",foot:"Нідерландська мова для всіх",
  tabs:{questions:"Запитання",dehet:"De / Het",verbs:"Дієслова",colors:"Кольори",numbers:"Числа",seasons:"Пори та час"},
  subs:{questions:"Що означає питальне слово?",dehet:"Оберіть артикль",verbs:"Перекладіть дієслово",colors:"Який це колір?",numbers:"Переклад числа",seasons:"Перекладіть слово"},
  hints:{questions:"Запитання",verbs:"Дієслово",colors:"Колір",numbers:"Число",seasons:"Час / Пора року"}
 },
 en:{
  qProgress:"Question",round:"Round",listen:"🔊 Listen",next:"Next",again:"Try again",
  nextTopic:"Next topic",accuracy:"accuracy",foot:"Learn Dutch easily",
  tabs:{questions:"Questions",dehet:"De / Het",verbs:"Verbs",colors:"Colors",numbers:"Numbers",seasons:"Seasons & Time"},
  subs:{questions:"What does this question word mean?",dehet:"Choose the article",verbs:"Translate the verb",colors:"Which color is this?",numbers:"Number translation",seasons:"Translate the word"},
  hints:{questions:"Question",verbs:"Verb",colors:"Color",numbers:"Number",seasons:"Time / Season"}
 },
 fr:{
  qProgress:"Question",round:"Tour",listen:"🔊 Écouter",next:"Suivant",again:"Recommencer",
  nextTopic:"Sujet suivant",accuracy:"précision",foot:"Apprendre le néerlandais",
  tabs:{questions:"Questions",dehet:"De / Het",verbs:"Verbes",colors:"Couleurs",numbers:"Nombres",seasons:"Saisons & Temps"},
  subs:{questions:"Que signifie ce mot interrogatif?",dehet:"Choisissez l'article",verbs:"Traduisez le verbe",colors:"Quelle est cette couleur?",numbers:"Traduction du nombre",seasons:"Traduisez le mot"},
  hints:{questions:"Question",verbs:"Verbe",colors:"Couleur",numbers:"Nombre",seasons:"Temps / Saison"}
 }
};

var DATA={
 questions:{labelKey:"questions",items:[
  {nl:"wat",uk:"що",en:"what",fr:"quoi",ex:"Wat is je naam?",exuk:"Яке твоє ім'я?",exen:"What is your name?",exfr:"Quel est ton nom?"},
  {nl:"wie",uk:"хто",en:"who",fr:"qui",ex:"Wie is dat?",exuk:"Хто це?",exen:"Who is that?",exfr:"Qui est-ce?"},
  {nl:"waar",uk:"де",en:"where",fr:"où",ex:"Waar woon je?",exuk:"Де ти живеш?",exen:"Where do you live?",exfr:"Où habites-tu?"},
  {nl:"waarvandaan",uk:"звідки",en:"where from",fr:"d'où",ex:"Waar kom je vandaan?",exuk:"Звідки ти?",exen:"Where are you from?",exfr:"D'où viens-tu?"},
  {nl:"wanneer",uk:"коли",en:"when",fr:"quand",ex:"Wanneer begint de les?",exuk:"Коли починається урок?",exen:"When does the lesson start?",exfr:"Quand commence le cours?"},
  {nl:"waarom",uk:"чому",en:"why",fr:"pourquoi",ex:"Waarom leer je Nederlands?",exuk:"Чому ти вчиш нідерландську?",exen:"Why do you learn Dutch?",exfr:"Pourquoi apprends-tu le néerlandais?"},
  {nl:"hoe",uk:"як",en:"how",fr:"comment",ex:"Hoe heet je?",exuk:"Як тебе звати?",exen:"What is your name?",exfr:"Comment t'appelles-tu?"},
  {nl:"hoeveel",uk:"скільки",en:"how much / many",fr:"combien",ex:"Hoeveel kinderen heb je?",exuk:"Скільки в тебе дітей?",exen:"How many children do you have?",exfr:"Combien d'enfants as-tu?"},
  {nl:"hoe laat",uk:"котра година",en:"what time",fr:"quelle heure",ex:"Hoe laat is het?",exuk:"Котра зараз година?",exen:"What time is it?",exfr:"Quelle heure est-il?"},
  {nl:"welke / welk",uk:"який / яка",en:"which",fr:"quel / quelle",ex:"Welke kleur is dit?",exuk:"Який це колір?",exen:"Which color is this?",exfr:"Quelle couleur est-ce?",say:"welke, welk"}
 ]},
 dehet:{labelKey:"dehet",items:[
  {nl:"huis",uk:"будинок",en:"house",fr:"maison",art:"het"},{nl:"man",uk:"чоловік",en:"man",fr:"homme",art:"de"},{nl:"vrouw",uk:"жінка",en:"woman",fr:"femme",art:"de"},
  {nl:"kind",uk:"дитина",en:"child",fr:"enfant",art:"het"},{nl:"tafel",uk:"стіл",en:"table",fr:"table",art:"de"},{nl:"stoel",uk:"стілець",en:"chair",fr:"chaise",art:"de"},
  {nl:"boek",uk:"книга",en:"book",fr:"livre",art:"het"},{nl:"auto",uk:"автомобіль",en:"car",fr:"voiture",art:"de"},{nl:"water",uk:"вода",en:"water",fr:"eau",art:"het"},
  {nl:"kat",uk:"кіт",en:"cat",fr:"chat",art:"de"},{nl:"hond",uk:"собака",en:"dog",fr:"chien",art:"de"},{nl:"meisje",uk:"дівчинка",en:"girl",fr:"fille",art:"het"},
  {nl:"brood",uk:"хліб",en:"bread",fr:"pain",art:"het"},{nl:"fiets",uk:"велосипед",en:"bicycle",fr:"vélo",art:"de"},{nl:"school",uk:"школа",en:"school",fr:"école",art:"de"},{nl:"raam",uk:"вікно",en:"window",fr:"fenêtre",art:"het"}
 ]},
 verbs:{labelKey:"verbs",items:[
  {nl:"zijn",uk:"бути",en:"to be",fr:"être",ex:"Ik ben thuis.",exuk:"Я вдома.",exen:"I am home.",exfr:"Je suis à la maison."},
  {nl:"hebben",uk:"мати",en:"to have",fr:"avoir",ex:"Ik heb twee kinderen.",exuk:"У мене двоє дітей.",exen:"I have two children.",exfr:"J'ai deux enfants."},
  {nl:"doen",uk:"робити",en:"to do",fr:"faire",ex:"Wat doe je?",exuk:"Що ти робиш?",exen:"What are you doing?",exfr:"Que fais-tu?"},
  {nl:"gaan",uk:"іти / їхати",en:"to go",fr:"aller",ex:"Ik ga naar school.",exuk:"Я йду до школи.",exen:"I go to school.",exfr:"Je vais à l'école."},
  {nl:"komen",uk:"приходити",en:"to come",fr:"venir",ex:"Ik kom uit Oekraïne.",exuk:"Я з України.",exen:"I come from Ukraine.",exfr:"Je viens d'Ukraine."},
  {nl:"zien",uk:"бачити",en:"to see",fr:"voir",ex:"Ik zie een kat.",exuk:"Я бачу кота.",exen:"I see a cat.",exfr:"Je vois un chat."},
  {nl:"willen",uk:"хотіти",en:"to want",fr:"vouloir",ex:"Ik wil water.",exuk:"Я хочу води.",exen:"I want water.",exfr:"Je veux de l'eau."},
  {nl:"wonen",uk:"жити",en:"to live",fr:"habiter",ex:"Ik woon in België.",exuk:"Я живу в Бельгії.",exen:"I live in Belgium.",exfr:"J'habite en Belgique."},
  {nl:"werken",uk:"працювати",en:"to work",fr:"travailler",ex:"Hij werkt veel.",exuk:"Він багато працює.",exen:"He works a lot.",exfr:"Il travaille beaucoup."},
  {nl:"spreken",uk:"говорити",en:"to speak",fr:"parler",ex:"Spreek je Nederlands?",exuk:"Ти говориш нідерландською?",exen:"Do you speak Dutch?",exfr:"Parles-tu néerlandais?"},
  {nl:"kijken",uk:"дивитися",en:"to watch",fr:"regarder",ex:"Ik kijk TV.",exuk:"Я дивлюся телевізор.",exen:"I watch TV.",exfr:"Je regarde la télé."},
  {nl:"luisteren",uk:"слухати",en:"to listen",fr:"écouter",ex:"Ik luister naar muziek.",exuk:"Я слухаю музику.",exen:"I listen to music.",exfr:"J'écoute de la musique."},
  {nl:"schrijven",uk:"писати",en:"to write",fr:"écrire",ex:"Hij schrijft een brief.",exuk:"Він пише листа.",exen:"He writes a letter.",exfr:"Il écrit une lettre."},
  {nl:"lezen",uk:"читати",en:"to read",fr:"lire",ex:"Zij leest een boek.",exuk:"Вона читає книжку.",exen:"She reads a book.",exfr:"Elle lit un livre."},
  {nl:"kopen",uk:"купувати",en:"to buy",fr:"acheter",ex:"Ik koop brood.",exuk:"Я купую хліб.",exen:"I buy bread.",exfr:"J'achète du pain."},
  {nl:"eten",uk:"їсти",en:"to eat",fr:"manger",ex:"Wij eten appel.",exuk:"Ми їмо яблуко.",exen:"We eat an apple.",exfr:"Nous mangeons une pomme."},
  {nl:"drinken",uk:"пити",en:"to drink",fr:"boire",ex:"Ik drink koffie.",exuk:"Я п'ю каву.",exen:"I drink coffee.",exfr:"Je bois du café."}
 ]},
 colors:{labelKey:"colors",items:[
  {nl:"rood",uk:"червоний",en:"red",fr:"rouge",c:"#ef4444"},{nl:"blauw",uk:"синій",en:"blue",fr:"bleu",c:"#3b82f6"},{nl:"groen",uk:"зелений",en:"green",fr:"vert",c:"#22c55e"},
  {nl:"geel",uk:"жовтий",en:"yellow",fr:"jaune",c:"#eab308"},{nl:"zwart",uk:"чорний",en:"black",fr:"noir",c:"#09090b"},{nl:"wit",uk:"білий",en:"white",fr:"blanc",c:"#ffffff"},
  {nl:"oranje",uk:"помаранчевий",en:"orange",fr:"orange",c:"#f97316"},{nl:"roze",uk:"рожевий",en:"pink",fr:"rose",c:"#ec4899"},{nl:"paars",uk:"фіолетовий",en:"purple",fr:"violet",c:"#a855f7"},
  {nl:"grijs",uk:"сірий",en:"grey",fr:"gris",c:"#6b7280"},{nl:"bruin",uk:"коричневий",en:"brown",fr:"marron",c:"#78350f"}
 ]},
 numbers:{labelKey:"numbers",items:[
  {nl:"een",uk:"1 · один",en:"1 · one",fr:"1 · un"},{nl:"twee",uk:"2 · два",en:"2 · two",fr:"2 · deux"},{nl:"drie",uk:"3 · три",en:"3 · three",fr:"3 · trois"},{nl:"vier",uk:"4 · чотири",en:"4 · four",fr:"4 · quatre"},
  {nl:"vijf",uk:"5 · п’ять",en:"5 · five",fr:"5 · cinq"},{nl:"zes",uk:"6 · шість",en:"6 · six",fr:"6 · six"},{nl:"zeven",uk:"7 · сім",en:"7 · seven",fr:"7 · sept"},{nl:"acht",uk:"8 · вісім",en:"8 · eight",fr:"8 · huit"},
  {nl:"negen",uk:"9 · дев’ять",en:"9 · nine",fr:"9 · neuf"},{nl:"tien",uk:"10 · десять",en:"10 · ten",fr:"10 · dix"},{nl:"elf",uk:"11 · одинадцять",en:"11 · eleven",fr:"11 · onze"},
  {nl:"twaalf",uk:"12 · дванадцять",en:"12 · twelve",fr:"12 · douze"},{nl:"vijftien",uk:"15 · п'ятнадцять",en:"15 · fifteen",fr:"15 · quinze"},{nl:"twintig",uk:"20 · двадцять",en:"20 · twenty",fr:"20 · vingt"},
  {nl:"dertig",uk:"30 · тридцять",en:"30 · thirty",fr:"30 · trente"},{nl:"vijftig",uk:"50 · п'ятдесят",en:"50 · fifty",fr:"50 · cinquante"},{nl:"honderd",uk:"100 · сто",en:"100 · hundred",fr:"100 · cent"},
  {nl:"duizend",uk:"1000 · тисяча",en:"1000 · thousand",fr:"1000 · mille"}
 ]},
 seasons:{labelKey:"seasons",items:[
  {nl:"de lente",uk:"весна",en:"spring",fr:"printemps",ex:"Het is lente.",exuk:"Зараз весна.",exen:"It is spring.",exfr:"C'est le printemps."},
  {nl:"de zomer",uk:"літо",en:"summer",fr:"été",ex:"In de zomer is het warm.",exuk:"Улітку тепло.",exen:"In summer it is warm.",exfr:"En été il fait chaud."},
  {nl:"de herfst",uk:"осінь",en:"autumn",fr:"automne",ex:"In de herfst regent het.",exuk:"Восени іде дощ.",exen:"In autumn it rains.",exfr:"En automne il pleut."},
  {nl:"de winter",uk:"зима",en:"winter",fr:"hiver",ex:"In de winter is het koud.",exuk:"Узимку холодно.",exen:"In winter it is cold.",exfr:"En hiver il fait froid."},
  {nl:"vandaag",uk:"сьогодні",en:"today",fr:"aujourd'hui",ex:"Vandaag is het maandag.",exuk:"Сьогодні понеділок.",exen:"Today is Monday.",exfr:"Aujourd'hui c'est lundi."},
  {nl:"morgen",uk:"завтра",en:"tomorrow",fr:"demain",ex:"Tot morgen!",exuk:"До завтра!",exen:"See you tomorrow!",exfr:"À demain!"},
  {nl:"gisteren",uk:"вчора",en:"yesterday",fr:"hier",ex:"Gisteren was het zondag.",exuk:"Учора була неділя.",exen:"Yesterday was Sunday.",exfr:"Hier c'était dimanche."}
 ]}
};

var tab="questions",deck=[],q=0,right=0,round=1,locked=false,item=null,score=0,voice=null;
try{score=parseInt(localStorage.getItem("nl_score")||"0",10)||0}catch(e){}

function getTr(obj,key){
 if(!obj) return "";
 return obj[key+"_"+userLang] || obj[userLang] || obj.uk || "";
}

function changeLang(l){
 userLang=l;
 localStorage.setItem("nl_lang",l);
 $("footText").textContent=UI[userLang].foot;
 buildTabs();
 newRound();
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pickVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.find(function(x){return /^nl/i.test(x.lang)})||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="nl-NL";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function full(it){return it.art?it.art+" "+it.nl:it.nl}
function spoken(it){return it.ex?(it.say||it.nl)+". "+it.ex:full(it)}

function buildTabs(){
 $("tabs").innerHTML="";
 var u=UI[userLang];
 Object.keys(DATA).forEach(function(k){
  var b=document.createElement("button");
  b.textContent=u.tabs[k]||DATA[k].labelKey;
  b.className=k===tab?"on":"";
  b.onclick=function(){tab=k;buildTabs();newRound()};
  $("tabs").appendChild(b);
 });
}

function newRound(){q=0;right=0;deck=[];next()}
function draw(){if(!deck.length)deck=shuffle(DATA[tab].items);return deck.pop()}

function next(){
 if(q>=PER_ROUND)return end();
 locked=false;item=draw();q++;
 var d=DATA[tab];
 var u=UI[userLang];
 
 $("prog").textContent=u.qProgress+" "+q+" / "+PER_ROUND;
 $("rnd").textContent=u.round+" "+round;
 $("barfill").style.width=((q-1)/PER_ROUND*100)+"%";
 $("score").textContent="⚡ "+score;
 
 var opts;
 if(tab==="dehet"){
  opts=["de","het"].map(function(a){return{label:a,ok:a===item.art}});
 } else {
  var others=shuffle(d.items.filter(function(x){return getTr(x,"")!==getTr(item,"")})).slice(0,3);
  opts=shuffle(others.concat([item])).map(function(x){return{label:getTr(x,""),ok:x===item,c:x.c}});
 }
 
 var subText=u.subs[tab];
 var hintText=tab==="dehet"?getTr(item,""):u.hints[tab];
 
 $("card").innerHTML='<div class="q"><small>'+subText+'</small><h2 lang="nl">'+item.nl+'</h2><p>'+hintText+'</p><button class="listen" id="hear">'+u.listen+'</button></div>'+
  '<div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="row"><button class="btn main" id="nx" disabled>'+u.next+'</button></div>';
 
 $("hear").onclick=function(){say(tab==="dehet"?item.nl:item.nl==="welke / welk"?"welke, welk":item.nl)};
 
 var box=$("opts");
 opts.forEach(function(o){
  var b=document.createElement("button");b.className="opt";
  b.innerHTML=(o.c?'<span class="sw" style="background:'+o.c+'"></span>':"")+"<span></span>";
  b.lastChild.textContent=o.label;b.dataset.ok=o.ok?"1":"";
  b.onclick=function(){answer(o.ok,b)};box.appendChild(b);
 });
}

function answer(ok,btn){
 if(locked)return;locked=true;
 var u=UI[userLang];
 document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.dataset.ok)b.classList.add("ok")});
 if(ok){right++;score+=10;try{localStorage.setItem("nl_score",score)}catch(e){}}else{btn.classList.add("bad")}
 $("score").textContent="⚡ "+score;
 
 var line=item.ex||full(item);
 var tr=getTr(item,"ex")||getTr(item,"");
 $("fb").innerHTML='<b lang="nl"></b><p></p>';
 $("fb").firstChild.textContent=line;
 $("fb").lastChild.textContent=tr;
 $("nx").disabled=false;
 $("nx").onclick=next;
 say(spoken(item));
}

function end(){
 $("barfill").style.width="100%";
 var pct=Math.round(right/PER_ROUND*100);
 var u=UI[userLang];
 var keys=Object.keys(DATA);
 var nextIndex=(keys.indexOf(tab)+1)%keys.length;
 var nextTabKey=keys[nextIndex];
 var nextTabLabel=u.tabs[nextTabKey];

 $("card").innerHTML='<div class="end"><h2>'+right+' / '+PER_ROUND+'</h2><p>'+pct+'% '+u.accuracy+'</p>'+
  '<div class="row">'+
  '<button class="btn" id="again">'+u.again+'</button>'+
  '<button class="btn main" id="nextTopic">'+u.nextTopic+' ('+nextTabLabel+') ➔</button>'+
  '</div></div>';
 
 round++;

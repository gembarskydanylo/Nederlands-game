<!DOCTYPE html>
<html lang="uk" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нідерландська мова - Тренажер</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dutch: {
                            blue: '#21468B',
                            red: '#AE1C28',
                            orange: '#FF4F00'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col justify-between font-sans text-slate-800 antialiased selection:bg-orange-200">

    <!-- Header / Nav -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🇳🇱</span>
                <h1 class="font-bold text-lg text-slate-800 tracking-tight">Nederlands Leren</h1>
            </div>
            <div class="flex items-center gap-2">
                <span id="streak-counter" class="text-xs font-semibold text-amber-600 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full flex items-center gap-1">
                    ⚡ <span id="streak-count">0</span>
                </span>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="max-w-md mx-auto px-4 flex gap-2 border-t border-slate-100 pt-2 pb-2">
            <button id="tab-dehet" onclick="switchTab('dehet')" class="flex-1 py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-slate-800 text-white shadow-sm">
                De / Het
            </button>
            <button id="tab-pytwoorde" onclick="switchTab('pytwoorde')" class="flex-1 py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200">
                Запитання
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto w-full flex-1 px-4 py-6 flex flex-col justify-center">

        <!-- DE / HET GAME SECTION -->
        <section id="section-dehet" class="flex flex-col gap-5">
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                <div id="dehet-progress" class="bg-slate-800 h-full w-0 transition-all duration-300"></div>
            </div>

            <div class="flex justify-between items-center text-xs font-medium text-slate-500">
                <span>Питання <span id="dehet-current-q">1</span> з 10</span>
                <span>Раунд: <span id="dehet-round-count">1</span></span>
            </div>

            <!-- Card -->
            <div id="dehet-card" class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-md flex flex-col items-center justify-center text-center transition-all duration-300 min-h-[220px]">
                <span id="dehet-emoji" class="text-5xl mb-4 transform hover:scale-110 transition-transform">📖</span>
                <h2 id="dehet-word" class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">---</h2>
                <p id="dehet-translation" class="text-slate-500 text-sm font-medium">---</p>
            </div>

            <!-- Choices -->
            <div class="grid grid-cols-2 gap-4">
                <button id="btn-de" onclick="handleDeHetAnswer('de')" class="py-4 px-6 bg-white border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 font-bold text-2xl text-slate-800 rounded-2xl shadow-sm transition-all duration-150 active:scale-95 flex items-center justify-center">
                    DE
                </button>
                <button id="btn-het" onclick="handleDeHetAnswer('het')" class="py-4 px-6 bg-white border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 font-bold text-2xl text-slate-800 rounded-2xl shadow-sm transition-all duration-150 active:scale-95 flex items-center justify-center">
                    HET
                </button>
            </div>
        </section>

        <!-- PYTWOORDE GAME SECTION -->
        <section id="section-pytwoorde" class="hidden flex-col gap-5">
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                <div id="pyt-progress" class="bg-slate-800 h-full w-0 transition-all duration-300"></div>
            </div>

            <div class="flex justify-between items-center text-xs font-medium text-slate-500">
                <span>Питання <span id="pyt-current-q">1</span> з 10</span>
                <span>Раунд: <span id="pyt-round-count">1</span></span>
            </div>

            <!-- Card -->
            <div id="pyt-card" class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-md flex flex-col items-center justify-center text-center transition-all duration-300 min-h-[180px]">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Оберіть правильне питальне слово</span>
                <h2 id="pyt-question" class="text-xl font-bold text-slate-900 leading-snug mb-2">---</h2>
                <p id="pyt-hint" class="text-slate-500 text-xs font-medium bg-slate-100 px-3 py-1 rounded-full">---</p>
            </div>

            <!-- Choices Grid (4 options) -->
            <div id="pyt-options" class="grid grid-cols-2 gap-3">
                <!-- Dynamic Options Rendered via JS -->
            </div>
        </section>

        <!-- ROUND RESULTS MODAL -->
        <div id="results-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform transition-all scale-95 opacity-0 modal-content">
                <div class="text-5xl mb-3" id="modal-emoji">🎉</div>
                <h3 class="text-2xl font-extrabold text-slate-900 mb-1">Раунд завершено!</h3>
                <p class="text-slate-500 text-sm mb-6">Ваш результат у цьому раунді:</p>

                <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 mb-6">
                    <div id="modal-score" class="text-4xl font-black text-slate-800 mb-1">0 / 10</div>
                    <div id="modal-percentage" class="text-xs font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 inline-block px-3 py-1 rounded-full">0% точність</div>
                </div>

                <div class="flex flex-col gap-2">
                    <button onclick="restartRound()" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl shadow-lg hover:bg-slate-800 transition-all active:scale-98">
                        Пройти ще раз 🔄
                    </button>
                    <button onclick="closeModal()" class="w-full py-3 text-slate-600 font-semibold rounded-xl hover:bg-slate-100 transition-all">
                        Закрити
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-md mx-auto w-full px-4 py-4 text-center text-xs text-slate-400">
        Нідерландська мова для українців • 2026
    </footer>

    <!-- App Logic JavaScript -->
    <script>
        // --- DATA SETS ---
        const deHetWords = [
            { word: 'huis', article: 'het', ukr: 'будинок', emoji: '🏠' },
            { word: 'man', article: 'de', ukr: 'чоловік', emoji: '👨' },
            { word: 'vrouw', article: 'de', ukr: 'жінка', emoji: '👩' },
            { word: 'kind', article: 'het', ukr: 'дитина', emoji: '👶' },
            { word: 'boek', article: 'het', ukr: 'книга', emoji: '📚' },
            { word: 'tafel', article: 'de', ukr: 'стіл', emoji: '🪑' },
            { word: 'stoel', article: 'de', ukr: 'стілець', emoji: '🪑' },
            { word: 'auto', article: 'de', ukr: 'автомобіль', emoji: '🚗' },
            { word: 'fiets', article: 'de', ukr: 'велосипед', emoji: '🚲' },
            { word: 'water', article: 'het', ukr: 'вода', emoji: '💧' },
            { word: 'brood', article: 'het', ukr: 'хліб', emoji: '🍞' },
            { word: 'appel', article: 'de', ukr: 'яблуко', emoji: '🍎' },
            { word: 'kat', article: 'de', ukr: 'кіт', emoji: '🐱' },
            { word: 'hond', article: 'de', ukr: 'собака', emoji: '🐶' },
            { word: 'werk', article: 'het', ukr: 'робота', emoji: '💼' },
            { word: 'school', article: 'de', ukr: 'школа', emoji: '🏫' },
            { word: 'stad', article: 'de', ukr: 'місто', emoji: '🏙️' },
            { word: 'land', article: 'het', ukr: 'країна', emoji: '🇳🇱' }
        ];

        const pytwoordeData = [
            { word: 'wat', ukr: 'що', sentence: '___ is jouw naam?', translation: '___ твоє ім’я?' },
            { word: 'waarom', ukr: 'чому', sentence: '___ ben je te laat?', translation: '___ ти запізнився?' },
            { word: 'wanneer', ukr: 'коли', sentence: '___ begint de les?', translation: '___ починається урок?' },
            { word: 'wie', ukr: 'хто', sentence: '___ is die man?', translation: '___ той чоловік?' },
            { word: 'waar', ukr: 'де', sentence: '___ woon jij?', translation: '___ ти живеш?' },
            { word: 'hoe', ukr: 'як', sentence: '___ gaat het met jou?', translation: '___ у тебе справи?' },
            { word: 'welke', ukr: 'який / яка / які', sentence: '___ bus neem jij?', translation: '___ автобус ти береш?' },
            { word: 'hoeveel', ukr: 'скільки', sentence: '___ kost dit boek?', translation: '___ коштує ця книга?' },
            { word: 'waarnaar', ukr: 'куди / до чого', sentence: '___ kijk je?', translation: '___ ти дивишся?' },
            { word: 'waarmee', ukr: 'чим / з чим', sentence: '___ schrijf je?', translation: '___ ти пишеш?' }
        ];

        // --- STATE MANAGEMENT ---
        let currentTab = 'dehet';
        let streak = 0;
        let isProcessing = false; // Prevents fast double-clicking bugs

        // De/Het state
        let dehetIndex = 0;
        let dehetScore = 0;
        let dehetRound = 1;
        let dehetQueue = [];

        // Pytwoorde state
        let pytIndex = 0;
        let pytScore = 0;
        let pytRound = 1;
        let pytQueue = [];

        // --- INIT & UTILS ---
        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function initApp() {
            startDeHetRound();
            startPytRound();
        }

        function switchTab(tab) {
            if (isProcessing) return;
            currentTab = tab;

            const btnDeHet = document.getElementById('tab-dehet');
            const btnPyt = document.getElementById('tab-pytwoorde');
            const secDeHet = document.getElementById('section-dehet');
            const secPyt = document.getElementById('section-pytwoorde');

            if (tab === 'dehet') {
                btnDeHet.className = 'flex-1 py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-slate-800 text-white shadow-sm';
                btnPyt.className = 'flex-1 py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200';
                secDeHet.classList.remove('hidden');
                secDeHet.classList.add('flex');
                secPyt.classList.add('hidden');
                secPyt.classList.remove('flex');
            } else {
                btnPyt.className = 'flex-1 py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-slate-800 text-white shadow-sm';
                btnDeHet.className = 'flex-1 py-2 px-3 text-sm font-semibold rounded-xl transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200';
                secPyt.classList.remove('hidden');
                secPyt.classList.add('flex');
                secDeHet.classList.add('hidden');
                secDeHet.classList.remove('flex');
            }
        }

        function updateStreak(success) {
            if (success) {
                streak++;
            } else {
                streak = 0;
            }
            document.getElementById('streak-count').innerText = streak;
        }

        // --- DE / HET LOGIC ---
        function startDeHetRound() {
            dehetQueue = shuffle(dehetWords).slice(0, 10);
            dehetIndex = 0;
            dehetScore = 0;
            renderDeHetQuestion();
        }

        function renderDeHetQuestion() {
            const current = dehetQueue[dehetIndex];
            document.getElementById('dehet-word').innerText = current.word;
            document.getElementById('dehet-translation').innerText = current.ukr;
            document.getElementById('dehet-emoji').innerText = current.emoji;

            document.getElementById('dehet-current-q').innerText = dehetIndex + 1;
            document.getElementById('dehet-round-count').innerText = dehetRound;
            document.getElementById('dehet-progress').style.width = `${((dehetIndex) / 10) * 100}%`;

            resetDeHetButtonStyles();
        }

        function resetDeHetButtonStyles() {
            const btnDe = document.getElementById('btn-de');
            const btnHet = document.getElementById('btn-het');

            btnDe.className = "py-4 px-6 bg-white border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 font-bold text-2xl text-slate-800 rounded-2xl shadow-sm transition-all duration-150 active:scale-95 flex items-center justify-center";
            btnHet.className = "py-4 px-6 bg-white border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 font-bold text-2xl text-slate-800 rounded-2xl shadow-sm transition-all duration-150 active:scale-95 flex items-center justify-center";

            btnDe.blur();
            btnHet.blur();
        }

        function handleDeHetAnswer(selected) {
            if (isProcessing) return;
            isProcessing = true;

            const current = dehetQueue[dehetIndex];
            const isCorrect = selected === current.article;

            const btnDe = document.getElementById('btn-de');
            const btnHet = document.getElementById('btn-het');
            const targetBtn = selected === 'de' ? btnDe : btnHet;

            if (isCorrect) {
                dehetScore++;
                updateStreak(true);
                targetBtn.className = "py-4 px-6 bg-emerald-500 border-2 border-emerald-600 font-bold text-2xl text-white rounded-2xl shadow-md transition-all duration-150 flex items-center justify-center scale-105";
            } else {
                updateStreak(false);
                targetBtn.className = "py-4 px-6 bg-rose-500 border-2 border-rose-600 font-bold text-2xl text-white rounded-2xl shadow-md transition-all duration-150 flex items-center justify-center";

                // Highlight correct one
                const correctBtn = current.article === 'de' ? btnDe : btnHet;
                correctBtn.className = "py-4 px-6 bg-emerald-100 border-2 border-emerald-400 font-bold text-2xl text-emerald-800 rounded-2xl shadow-sm flex items-center justify-center";
            }

            setTimeout(() => {
                dehetIndex++;
                if (dehetIndex >= 10) {
                    showModal(dehetScore, 10);
                } else {
                    renderDeHetQuestion();
                }
                isProcessing = false;
            }, 800);
        }

        // --- PYTWOORDE LOGIC ---
        function startPytRound() {
            pytQueue = shuffle(pytwoordeData).slice(0, 10);
            pytIndex = 0;
            pytScore = 0;
            renderPytQuestion();
        }

        function renderPytQuestion() {
            const current = pytQueue[pytIndex];

            document.getElementById('pyt-question').innerText = current.sentence;
            document.getElementById('pyt-hint').innerText = `Переклад: ${current.translation}`;

            document.getElementById('pyt-current-q').innerText = pytIndex + 1;
            document.getElementById('pyt-round-count').innerText = pytRound;
            document.getElementById('pyt-progress').style.width = `${((pytIndex) / 10) * 100}%`;

            // Prepare options (1 correct + 3 wrong)
            const optionsContainer = document.getElementById('pyt-options');
            optionsContainer.innerHTML = '';

            const otherWords = pytwoordeData.filter(item => item.word !== current.word);
            const shuffledOthers = shuffle(otherWords).slice(0, 3);
            const allChoices = shuffle([current, ...shuffledOthers]);

            allChoices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "py-3 px-4 bg-white border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 font-bold text-base text-slate-800 rounded-2xl shadow-sm transition-all duration-150 active:scale-95 flex flex-col items-center justify-center";
                btn.innerHTML = `<span>${choice.word}</span><span class="text-xs font-normal text-slate-400">${choice.ukr}</span>`;
                btn.onclick = () => handlePytAnswer(choice.word, current.word, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handlePytAnswer(selected, correct, element) {
            if (isProcessing) return;
            isProcessing = true;

            const isCorrect = selected === correct;

            if (isCorrect) {
                pytScore++;
                updateStreak(true);
                element.className = "py-3 px-4 bg-emerald-500 border-2 border-emerald-600 font-bold text-base text-white rounded-2xl shadow-md transition-all duration-150 flex flex-col items-center justify-center scale-105";
            } else {
                updateStreak(false);
                element.className = "py-3 px-4 bg-rose-500 border-2 border-rose-600 font-bold text-base text-white rounded-2xl shadow-md transition-all duration-150 flex flex-col items-center justify-center";

                // Highlight correct button
                const buttons = document.getElementById('pyt-options').children;
                for (let btn of buttons) {
                    if (btn.innerText.includes(correct)) {
                        btn.className = "py-3 px-4 bg-emerald-100 border-2 border-emerald-400 font-bold text-base text-emerald-800 rounded-2xl shadow-sm flex flex-col items-center justify-center";
                    }
                }
            }

            setTimeout(() => {
                pytIndex++;
                if (pytIndex >= 10) {
                    showModal(pytScore, 10);
                } else {
                    renderPytQuestion();
                }
                isProcessing = false;
            }, 850);
        }

        // --- MODAL RESULTS LOGIC ---
        function showModal(score, total) {
            const percentage = Math.round((score / total) * 100);
            document.getElementById('modal-score').innerText = `${score} / ${total}`;
            document.getElementById('modal-percentage').innerText = `${percentage}% точність`;

            const modalEmoji = document.getElementById('modal-emoji');
            if (percentage >= 80) {
                modalEmoji.innerText = '🎉';
            } else if (percentage >= 50) {
                modalEmoji.innerText = '👍';
            } else {
                modalEmoji.innerText = '💪';
            }

            const modal = document.getElementById('results-modal');
            const content = modal.querySelector('.modal-content');

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('results-modal');
            const content = modal.querySelector('.modal-content');

            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function restartRound() {
            closeModal();
            if (currentTab === 'dehet') {
                dehetRound++;
                startDeHetRound();
            } else {
                pytRound++;
                startPytRound();
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

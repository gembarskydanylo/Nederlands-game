<html lang="uk">
<head>
<meta charset="UTF-8">

<title>Polyglot Leren — A1</title>
<style>
:root {
  --bg: #f7f8fc;
  --fg: #20243a;
  --mut: #686f82;
  --card: #ffffff;
  --line: #e5e8f0;
  --acc: #4657d9;
  --ok: #218653;
  --bad: #c43d4b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131c;
    --fg: #f0f2f8;
    --mut: #8e95a5;
    --card: #1c1e2d;
    --line: #2a2d40;
    --acc: #6372f2;
    --ok: #2ebd75;
    --bad: #e55362;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.4 -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
main {
  width: 100%;
  max-width: 540px;
  padding: 16px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
header h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.top-right { display: flex; align-items: center; gap: 6px; }
.select-group { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--mut); }
#score { color: var(--acc); font-size: 15px; font-weight: 700; margin-left: 4px; }
.lang-select {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--fg);
  border-radius: 8px;
  padding: 4px 6px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 8px 10px;
  font: inherit;
  font-size: 13px;
  color: var(--mut);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
nav button.on { color: var(--fg); border-bottom-color: var(--acc); font-weight: 600; }
.meta { display: flex; justify-content: space-between; color: var(--mut); font-size: 12px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: -6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .3s; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.q { text-align: center; }
.q small { color: var(--mut); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.q h2 { font-size: 32px; font-weight: 700; margin: 4px 0 2px; letter-spacing: -.02em; }
.q p { margin: 0; color: var(--mut); font-size: 14px; }
.listen {
  background: none;
  border: 1px solid var(--line);
  color: var(--fg);
  border-radius: 20px;
  padding: 5px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s;
}
.listen:active { background: var(--line); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt {
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--fg);
  border-radius: 12px;
  padding: 10px 8px;
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  min-height: 50px;
}
.opt:active { transform: scale(.98); }
.opt.ok { border-color: var(--ok); color: var(--ok); background: rgba(33, 134, 83, 0.08); font-weight: 700; }
.opt.bad { border-color: var(--bad); color: var(--bad); background: rgba(196, 61, 75, 0.08); }
.opt:disabled { cursor: default; }
.sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--mut); flex-shrink: 0; }
.fb { text-align: center; min-height: 56px; }
.fb b { font-size: 16px; font-weight: 600; color: var(--fg); }
.fb p { margin: 2px 0 0; color: var(--mut); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  flex: 1;
  min-width: 120px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--fg);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}
.btn.main { background: var(--acc); border-color: var(--acc); color: #fff; }
.end { text-align: center; display: flex; flex-direction: column; gap: 10px; }
.end h2 { font-size: 36px; margin: 0 0 2px; }
.end p { color: var(--mut); margin: 0 0 10px; font-size: 14px; }
footer { text-align: center; color: var(--mut); font-size: 11px; }
</style>
</head>

 $("appTitle").textContent = names[targetLang] + " Leren";
}

function shuffle(a) { a = a.slice(); for(var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function say(t, langCode) {
 try {
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(t);
  var langMap = { nl: "nl-NL", en: "en-US", fr: "fr-FR" };
  u.lang = langMap[langCode] || "en-US";
  u.rate = .85;
  speechSynthesis.speak(u);
 } catch(e) {}
}

function buildTabs() {
 $("tabs").innerHTML = "";
 var u = UI[uiLang];
 Object.keys(DATA).forEach(function(k) {
  var b = document.createElement("button");
  b.textContent = u.tabs[k] || DATA[k].labelKey;
  b.className = k === tab ? "on" : "";
  b.onclick = function() { tab = k; buildTabs(); newRound(); };
  $("tabs").appendChild(b);
 });
}

function newRound() { q = 0; right = 0; deck = []; next(); }
function draw() { if(!deck.length) deck = shuffle(DATA[tab].items); return deck.pop(); }

function next() {
 if(q >= PER_ROUND) return end();
 locked = false; item = draw(); q++;
 var d = DATA[tab];
 var u = UI[uiLang];
 
 $("prog").textContent = u.qProgress + " " + q + " / " + PER_ROUND;
 $("rnd").textContent = u.round + " " + round;
 $("barfill").style.width = ((q - 1) / PER_ROUND * 100) + "%";
 $("score").textContent = "⚡ " + score;
 
 var promptText = item[targetLang] || item.nl;
 var hintText = item[uiLang] || item.uk;
 
 var opts;
 if(tab === "dehet") {
  if(targetLang === "nl") opts = ["de", "het"].map(a => ({ label: a, ok: a === item.art_nl }));
  else if(targetLang === "fr") opts = ["le", "la", "l'"].map(a => ({ label: a, ok: a === item.art_fr }));
  else opts = ["a/an", "the"].map(a => ({ label: a, ok: a === item.art_en }));
 } else {
  var others = shuffle(d.items.filter(x => x.id !== item.id)).slice(0, 3);
  opts = shuffle(others.concat([item])).map(x => ({ label: x[uiLang] || x.uk, ok: x.id === item.id, c: x.c }));
 }
 
 var subText = u.subs[tab];
 var cardHint = tab === "dehet" ? hintText : u.hints[tab];
 
 $("card").innerHTML = '<div class="q"><small>' + subText + '</small><h2>' + promptText + '</h2><p>' + cardHint + '</p><button class="listen" id="hear">' + u.listen + '</button></div>' +
  '<div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="row"><button class="btn main" id="nx" disabled>' + u.next + '</button></div>';
 
 $("hear").onclick = function() { say(promptText, targetLang); };
 
 var box = $("opts");
 opts.forEach(function(o) {
  var b = document.createElement("button"); b.className = "opt";
  b.innerHTML = (o.c ? '<span class="sw" style="background:' + o.c + '"></span>' : "") + "<span></span>";
  b.lastChild.textContent = o.label; b.dataset.ok = o.ok ? "1" : "";
  b.onclick = function() { answer(o.ok, b); }; box.appendChild(b);
 });
}

function saveError(itemObj) {
 try {
  let errs = JSON.parse(localStorage.getItem("nl_errors") || "[]");
  if(!errs.some(e => e.id === itemObj.id)) {
   errs.push(itemObj);
   localStorage.setItem("nl_errors", JSON.stringify(errs));
  }
 } catch(e) {}
}

function answer(ok, btn) {
 if(locked) return; locked = true;
 var u = UI[uiLang];
 document.querySelectorAll(".opt").forEach(function(b) { b.disabled = true; if(b.dataset.ok) b.classList.add("ok"); });
 if(ok) {
  right++; score += 10;
  try { localStorage.setItem("nl_score", score); } catch(e) {}
 } else {
  btn.classList.add("bad");
  saveError(item);
 }
 $("score").textContent = "⚡ " + score;
 
 var line = item["ex_" + targetLang] || item[targetLang] || item.nl;
 var tr = item["ex_" + uiLang] || item[uiLang] || item.uk;
 
 $("fb").innerHTML = '<b></b><p></p>';
 $("fb").firstChild.textContent = line;
 $("fb").lastChild.textContent = tr;
 $("nx").disabled = false;
 $("nx").onclick = next;
 say(line, targetLang);
}

function end() {
 $("barfill").style.width = "100%";
 var pct = Math.round(right / PER_ROUND * 100);
 var u = UI[uiLang];
 var keys = Object.keys(DATA);
 var nextIndex = (keys.indexOf(tab) + 1) % keys.length;
 var nextTabKey = keys[nextIndex];
 var nextTabLabel = u.tabs[nextTabKey];

 $("card").innerHTML = '<div class="end"><h2>' + right + ' / ' + PER_ROUND + '</h2><p>' + pct + '% ' + u.accuracy + '</p>' +
  '<div class="row">' +
  '<button class="btn" id="again">' + u.again + '</button>' +
  '<button class="btn main" id="nextTopic">' + u.nextTopic + ' (' + nextTabLabel + ') ➔</button>' +
  '</div></div>';
 
 round++;
 $("again").onclick = newRound;
 $("nextTopic").onclick = function() {
  tab = nextTabKey;
  buildTabs();
  newRound();
 };
}

window.onload = function() {
 $("targetLangPicker").value = targetLang;
 $("uiLangPicker").value = uiLang;
 $("footText").textContent = UI[uiLang].foot;
 updateHeaderTitle();
 buildTabs();
 newRound();
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FC">
<title>Polyglot Leren — Nederlands A1.1</title>
<style>
:root{color-scheme:light;--bg:#F7F8FC;--fg:#20243A;--mut:#686F82;--card:#FFFFFF;--line:#E5E8F0;--acc:#4657D9;--acc-hover:#3545c4;--ok:#218653;--ok-bg:#EAF7EF;--bad:#C43D4B;--bad-bg:#FFF0F1;--soft:#EEF1FF;--shadow:0 8px 30px rgba(32,36,58,.06);--amb:#B7791F}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11131A;--fg:#F2F3FA;--mut:#A4A9BA;--card:#1C1F2A;--line:#303443;--acc:#8794FF;--acc-hover:#9EA8FF;--ok:#62D493;--ok-bg:#183728;--bad:#FF858D;--bad-bg:#3B2027;--soft:#282D4B;--shadow:0 8px 30px rgba(0,0,0,.18);--amb:#E5B567}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
button{touch-action:manipulation}
main{width:100%;max-width:760px;margin:0 auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font-size:21px;line-height:1.2;margin:0;letter-spacing:-.04em}
.brand p{margin:1px 0 0;color:var(--mut);font-size:12px}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.select-group{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:12px}
.lang-select,.theme-btn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;min-height:36px;padding:5px 8px;font-size:13px}
.theme-btn{cursor:pointer;min-width:38px}
.score-pill{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.hero{border-radius:16px;padding:10px 14px;background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero h2{margin:0 0 2px;font-size:18px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--mut);font-size:13px}
.hero-stat{font-size:12px;color:var(--mut);text-align:right}
.hero-stat strong{display:block;font-size:18px;color:var(--fg)}

/* Навігація рівнів */
.nav-cats,.nav-subs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.nav-cats button,.nav-subs button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;font-size:13px;font-weight:600}
.nav-cats button[aria-selected="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.nav-subs button[aria-selected="true"]{color:var(--fg);border-color:var(--acc);background:var(--soft);font-weight:700}

.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12px}
.bar{height:4px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:-8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.q{text-align:center}
.q small{color:var(--mut);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.icon-box{font-size:44px;margin:6px 0 2px;line-height:1}
.q h2{font-size:clamp(22px,5vw,32px);font-weight:750;margin:4px 0 2px;letter-spacing:-.04em;overflow-wrap:anywhere}
.q p{margin:0;color:var(--mut);font-size:14px}
.listen{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;margin-top:6px;min-height:36px}
.listen:hover,.btn:hover,.opt:hover:not(:disabled){border-color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px 8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:48px;overflow-wrap:anywhere}
.opt:active{transform:scale(.985)}
.opt.correct{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.opt.incorrect{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.swatch{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex-shrink:0}
.feedback{border-radius:12px;padding:8px 10px;text-align:center;background:var(--bg)}
.feedback:empty{display:none}
.feedback strong{display:block;font-size:15px}
.feedback p{margin:2px 0 0;color:var(--mut);font-size:13px}
.feedback .example{margin-top:4px;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:650;cursor:pointer;text-align:center;min-height:42px;font-size:14px}
.modes{flex-wrap:nowrap;overflow-x:auto;gap:5px;scrollbar-width:none}
.modes .btn{flex:1 0 auto;min-width:0;min-height:36px;padding:6px 10px;font-size:12.5px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc-hover)}
.end{text-align:center;display:flex;flex-direction:column;gap:12px}
.end h2{font-size:36px;margin:0;letter-spacing:-.04em}
.end p{color:var(--mut);margin:0}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.summary-grid div{padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.summary-grid strong{display:block;font-size:18px}
.summary-grid span{font-size:11px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:10px;font-size:13px}
footer{text-align:center;color:var(--mut);font-size:11px}
.q h2.sm{font-size:20px;letter-spacing:-.02em}
.slots,.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.bank{min-height:44px}
.sw2{display:flex;flex-direction:column;align-items:center;gap:2px}
.sw2.rQ{--rc:var(--acc)}.sw2.rV{--rc:var(--ok)}.sw2.rS{--rc:var(--amb)}.sw2.rR{--rc:var(--mut)}
.role{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--rc)}
.slot{min-width:62px;min-height:42px;padding:6px 8px;border-radius:10px;border:1px dashed var(--line);border-bottom:3px solid var(--rc);background:var(--bg);color:var(--fg);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.slot.filled{border-style:solid}
.slot.bad{border-color:var(--bad);border-bottom-color:var(--bad);color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.slot.good{border-color:var(--ok);border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.tile{min-height:40px;padding:7px 11px;font-size:14.5px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
html[dir="rtl"] .hero-stat{text-align:left}

@media(max-width:480px){
 main{padding:10px 10px 20px;gap:10px}
 .brand h1{font-size:18px}
 .top-right{width:100%;justify-content:space-between}
 .hero{padding:8px 12px;border-radius:12px}.hero>div:first-child{display:none}
 .hero-stat{display:flex;gap:6px;align-items:baseline;justify-content:space-between;width:100%;text-align:left;font-size:11px}
 .hero-stat strong{display:inline;font-size:15px}
 .modes{flex-wrap:wrap;overflow:visible}.modes .btn{flex:1 1 30%;padding:6px 4px;min-height:34px;font-size:12px}
 .card{padding:14px 10px;gap:10px}
 .opts{gap:6px}
 .opt{font-size:13.5px;padding:8px 4px;min-height:44px}
 .slot{min-width:56px;min-height:38px;padding:4px 6px;font-size:13px}
 .tile{min-height:36px;padding:6px 9px;font-size:13.5px}
}
</style>
</head>

  <header>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nederlands Leren - Гра</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tab-btn.active {
            background-color: #1e293b;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .animate-bounce-short {
            animation: bounce 0.5s ease-in-out 1;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🇳🇱</span>
                <h1 class="font-bold text-lg text-slate-800">Nederlands Leren</h1>
            </div>
            <div class="flex items-center space-x-2 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                <i class="fas fa-bolt text-amber-500"></i>
                <span id="score-counter" class="font-bold text-amber-700">0</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- Navigation Tabs -->
        <nav class="flex flex-wrap gap-2 mb-6 justify-center bg-slate-200/60 p-1.5 rounded-xl border border-slate-300/50">
            <button onclick="switchTab('dehet')" id="tab-dehet" class="tab-btn active px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">De / Het</button>
            <button onclick="switchTab('verbs')" id="tab-verbs" class="tab-btn px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Дієслова</button>
            <button onclick="switchTab('colors')" id="tab-colors" class="tab-btn px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Кольори</button>
            <button onclick="switchTab('numbers')" id="tab-numbers" class="tab-btn px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Числа</button>
            <button onclick="switchTab('questions')" id="tab-questions" class="tab-btn px-4 py-2 rounded-lg font-semibold text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Запитання</button>
        </nav>

        <!-- Progress Bar & Round Info -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6">
            <div class="flex justify-between text-xs font-semibold text-slate-500 mb-2">
                <span id="question-progress">Питання 1 з 10</span>
                <span id="round-counter">Раунд: 1</span>
            </div>
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Game Screen Area -->
        <div id="game-card" class="bg-white rounded-2xl p-6 md:p-8 shadow-md border border-slate-200 text-center relative overflow-hidden min-h-[300px] flex flex-col justify-between">
            
            <div class="my-auto">
                <div id="prompt-subtitle" class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-2">Виберіть правильну відповідь</div>
                <div id="prompt-main" class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-2">---</div>
                <div id="prompt-hint" class="text-slate-500 text-sm italic font-medium">---</div>
            </div>

            <!-- Interactive Buttons Grid -->
            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6">
                <!-- Buttons will be dynamically inserted here -->
            </div>
        </div>

    </main>

    <!-- Modal Results Screen -->
    <div id="results-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl transform transition-all">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                🏆
            </div>
            <h2 class="text-2xl font-extrabold text-slate-800 mb-1">Круг завершено!</h2>
            <p class="text-slate-500 text-sm mb-6">Ваш підсумковий результат за цей круг:</p>
            
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-6">
                <div id="modal-score" class="text-3xl font-black text-indigo-600 mb-1">0 / 10</div>
                <div id="modal-percentage" class="text-xs font-semibold text-slate-500">0% точність</div>
            </div>

            <div class="space-y-2">
                <button onclick="restartRound()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all">
                    Пройти ще раз
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400">
        Нідерландська мова для українців • 2026
    </footer>

    <!-- Game Logic Scripts -->
    <script>
        // Data Structures
        const dehetData = [
            { word: 'huis', article: 'het', ukr: 'будинок' },
            { word: 'man', article: 'de', ukr: 'чоловік' },
            { word: 'vrouw', article: 'de', ukr: 'жінка' },
            { word: 'kind', article: 'het', ukr: 'дитина' },
            { word: 'tafel', article: 'de', ukr: 'стіл' },
            { word: 'stoel', article: 'de', ukr: 'стілець' },
            { word: 'boek', article: 'het', ukr: 'книга' },
            { word: 'auto', article: 'de', ukr: 'автомобіль' },
            { word: 'water', article: 'het', ukr: 'вода' },
            { word: 'kat', article: 'de', ukr: 'кіт' },
            { word: 'hond', article: 'de', ukr: 'собака' },
            { word: 'meisje', article: 'het', ukr: 'дівчинка' }
        ];

        const verbsData = [
            { nl: 'zijn', ukr: 'бути', opts: ['бути', 'мати', 'робити', 'ходити'] },
            { nl: 'hebben', ukr: 'мати', opts: ['мати', 'бути', 'знати', 'казати'] },
            { nl: 'doen', ukr: 'робити', opts: ['робити', 'бачити', 'іти', 'брати'] },
            { nl: 'gaan', ukr: 'іти / їхати', opts: ['іти / їхати', 'приходити', 'стояти', 'сидіти'] },
            { nl: 'komen', ukr: 'приходити', opts: ['приходити', 'бігти', 'думати', 'хотіти'] },
            { nl: 'zien', ukr: 'бачити', opts: ['бачити', 'чути', 'говорити', 'писати'] }
        ];

        const colorsData = [
            { nl: 'rood', ukr: 'червоний', color: '#ef4444' },
            { nl: 'blauw', ukr: 'синій', color: '#3b82f6' },
            { nl: 'groen', ukr: 'зелений', color: '#22c55e' },
            { nl: 'geel', ukr: 'жовтий', color: '#eab308' },
            { nl: 'zwart', ukr: 'чорний', color: '#09090b' },
            { nl: 'wit', ukr: 'білий', color: '#ffffff' }
        ];

        const numbersData = [
            { nl: 'een', ukr: '1 (один)' },
            { nl: 'twee', ukr: '2 (два)' },
            { nl: 'drie', ukr: '3 (три)' },
            { nl: 'vier', ukr: '4 (чотири)' },
            { nl: 'vijf', ukr: '5 (п’ять)' },
            { nl: 'tien', ukr: '10 (десять)' }
        ];

        const questionsData = [
            { nl: 'Wat', ukr: 'Що?', opts: ['Що?', 'Хто?', 'Де?', 'Чому?'] },
            { nl: 'Wie', ukr: 'Хто?', opts: ['Хто?', 'Що?', 'Коли?', 'Як?'] },
            { nl: 'Waar', ukr: 'Де?', opts: ['Де?', 'Куди?', 'Звідки?', 'Чому?'] },
            { nl: 'Wanneer', ukr: 'Коли?', opts: ['Коли?', 'Як?', 'Скільки?', 'Хто?'] },
            { nl: 'Waarom', ukr: 'Чому?', opts: ['Чому?', 'Що?', 'Де?', 'Коли?'] },
            { nl: 'Hoe', ukr: 'Як?', opts: ['Як?', 'Скільки?', 'Який?', 'Чому?'] },
            { nl: 'Welke', ukr: 'Який / Яка / Які?', opts: ['Який?', 'Хто?', 'Де?', 'Коли?'] },
            { nl: 'Hoeveel', ukr: 'Скільки?', opts: ['Скільки?', 'Як?', 'Чому?', 'Що?'] }
        ];

        // State variables
        let currentTab = 'dehet';
        let totalScore = parseInt(localStorage.getItem('nl_score') || '0');
        let currentRound = 1;
        let currentQuestion = 1;
        let roundCorrect = 0;
        let isLocked = false;
        let currentItem = null;

        document.getElementById('score-counter').innerText = totalScore;

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            restartRound();
        }

        function restartRound() {
            currentQuestion = 1;
            roundCorrect = 0;
            isLocked = false;
            document.getElementById('results-modal').classList.add('hidden');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isLocked = false;
            document.getElementById('question-progress').innerText = `Питання ${currentQuestion} з 10`;
            document.getElementById('round-counter').innerText = `Раунд: ${currentRound}`;
            document.getElementById('progress-bar').style.width = `${(currentQuestion / 10) * 100}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            if (currentTab === 'dehet') {
                currentItem = dehetData[Math.floor(Math.random() * dehetData.length)];
                document.getElementById('prompt-subtitle').innerText = 'Оберіть артикль (De чи Het)';
                document.getElementById('prompt-main').innerText = currentItem.word;
                document.getElementById('prompt-hint').innerText = currentItem.ukr;

                ['de', 'het'].forEach(art => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-4 rounded-xl border border-slate-300 text-xl transition-all uppercase';
                    btn.innerText = art;
                    btn.onclick = () => handleAnswer(art === currentItem.article, btn);
                    container.appendChild(btn);
                });
            } else if (currentTab === 'questions') {
                currentItem = questionsData[Math.floor(Math.random() * questionsData.length)];
                document.getElementById('prompt-subtitle').innerText = 'Оберіть правильний переклад питального слова';
                document.getElementById('prompt-main').innerText = currentItem.nl;
                document.getElementById('prompt-hint').innerText = 'Запитання';

                currentItem.opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl border border-slate-300 text-base transition-all';
                    btn.innerText = opt;
                    btn.onclick = () => handleAnswer(opt === currentItem.ukr, btn);
                    container.appendChild(btn);
                });
            } else if (currentTab === 'verbs') {
                currentItem = verbsData[Math.floor(Math.random() * verbsData.length)];
                document.getElementById('prompt-subtitle').innerText = 'Перекладіть дієслово';
                document.getElementById('prompt-main').innerText = currentItem.nl;
                document.getElementById('prompt-hint').innerText = 'Дієслово';

                currentItem.opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl border border-slate-300 text-base transition-all';
                    btn.innerText = opt;
                    btn.onclick = () => handleAnswer(opt === currentItem.ukr, btn);
                    container.appendChild(btn);
                });
            } else if (currentTab === 'colors') {
                currentItem = colorsData[Math.floor(Math.random() * colorsData.length)];
                document.getElementById('prompt-subtitle').innerText = 'Який це колір?';
                document.getElementById('prompt-main').innerText = currentItem.nl;
                document.getElementById('prompt-hint').innerText = 'Колір';

                colorsData.forEach(col => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl border border-slate-300 text-base transition-all flex items-center justify-center space-x-2';
                    btn.innerHTML = `<span class="w-4 h-4 rounded-full border border-slate-400" style="background:${col.color}"></span><span>${col.ukr}</span>`;
                    btn.onclick = () => handleAnswer(col.nl === currentItem.nl, btn);
                    container.appendChild(btn);
                });
            } else if (currentTab === 'numbers') {
                currentItem = numbersData[Math.floor(Math.random() * numbersData.length)];
                document.getElementById('prompt-subtitle').innerText = 'Переклад числа';
                document.getElementById('prompt-main').innerText = currentItem.nl;
                document.getElementById('prompt-hint').innerText = 'Число';

                numbersData.forEach(num => {
                    const btn = document.createElement('button');
                    btn.className = 'bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-3 px-4 rounded-xl border border-slate-300 text-base transition-all';
                    btn.innerText = num.ukr;
                    btn.onclick = () => handleAnswer(num.nl === currentItem.nl, btn);
                    container.appendChild(btn);
                });
            }
        }

        function handleAnswer(isCorrect, buttonEl) {
            if (isLocked) return;
            isLocked = true;

            if (isCorrect) {
                buttonEl.classList.remove('bg-slate-100', 'hover:bg-slate-200');
                buttonEl.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                totalScore += 10;
                roundCorrect++;
            } else {
                buttonEl.classList.remove('bg-slate-100', 'hover:bg-slate-200');
                buttonEl.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
            }

            localStorage.setItem('nl_score', totalScore);
            document.getElementById('score-counter').innerText = totalScore;

            setTimeout(() => {
                if (currentQuestion >= 10) {
                    showResults();
                } else {
                    currentQuestion++;
                    loadNextQuestion();
                }
            }, 700);
        }

        function showResults() {
            document.getElementById('modal-score').innerText = `${roundCorrect} / 10`;
            document.getElementById('modal-percentage').innerText = `${Math.round((roundCorrect / 10) * 100)}% точність`;
            document.getElementById('results-modal').classList.remove('hidden');
            currentRound++;
        }

        // Initialize on load
        window.onload = () => {
            loadNextQuestion();
        };
    </script>
</body>
</html>

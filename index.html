<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Nederlands leren</title>
<style>
:root{--bg:#f7f6f3;--fg:#1c1c1e;--mut:#8a8a8e;--card:#fff;--line:#e4e2dc;--acc:#2f4bd8;--ok:#2e8b57;--bad:#c8453b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--fg:#f2f2f4;--mut:#8e8e93;--card:#1c1c1f;--line:#2c2c30;--acc:#7b8dff;--ok:#4fbf82;--bad:#ef6b61}}
:root[data-theme="dark"]{--bg:#111113;--fg:#f2f2f4;--mut:#8e8e93;--card:#1c1c1f;--line:#2c2c30;--acc:#7b8dff;--ok:#4fbf82;--bad:#ef6b61}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Inter","Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:460px;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
#score{color:var(--mut);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 8px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 14px;display:flex;flex-direction:column;gap:16px}
.q{text-align:center}
.q small{color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.q h2{font-size:36px;font-weight:600;margin:6px 0 2px;letter-spacing:-.02em}
.q p{margin:0;color:var(--mut);font-size:14px}
.listen{background:none;border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:12px 6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:52px}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--mut);flex-shrink:0}
.fb{text-align:center;min-height:60px}
.fb b{font-size:17px;font-weight:600}
.fb p{margin:2px 0 0;color:var(--mut);font-size:13px}
.row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:500;cursor:pointer}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.end{text-align:center}
.end h2{font-size:36px;margin:0 0 4px}
.end p{color:var(--mut);margin:0 0 18px}
footer{text-align:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<main>
 <header><h1>Nederlands leren</h1><span id="score"></span></header>
 <nav id="tabs"></nav>
 <div class="meta"><span id="prog"></span><span id="rnd"></span></div>
 <div class="bar"><i id="barfill"></i></div>
 <div class="card" id="card"></div>
 <footer>Нідерландська мова для українців</footer>
</main>
<script>
var PER_ROUND=10;
var DATA={
 questions:{label:"Запитання",sub:"Що означає питальне слово?",hint:"Запитання",items:[
  {nl:"wat",uk:"що",ex:"Wat is je naam?",exuk:"Яке твоє ім'я?"},
  {nl:"wie",uk:"хто",ex:"Wie is dat?",exuk:"Хто це?"},
  {nl:"waar",uk:"де",ex:"Waar woon je?",exuk:"Де ти живеш?"},
  {nl:"waarvandaan",uk:"звідки",ex:"Waar kom je vandaan?",exuk:"Звідки ти?"},
  {nl:"wanneer",uk:"коли",ex:"Wanneer begint de les?",exuk:"Коли починається урок?"},
  {nl:"waarom",uk:"чому",ex:"Waarom leer je Nederlands?",exuk:"Чому ти вчиш нідерландську?"},
  {nl:"hoe",uk:"як",ex:"Hoe heet je?",exuk:"Як тебе звати?"},
  {nl:"hoeveel",uk:"скільки",ex:"Hoeveel kinderen heb je?",exuk:"Скільки в тебе дітей?"},
  {nl:"hoe laat",uk:"котра година",ex:"Hoe laat is het?",exuk:"Котра зараз година?"},
  {nl:"welke / welk",uk:"який / яка",ex:"Welke kleur is dit?",exuk:"Який це колір?",say:"welke, welk"}
 ]},
 dehet:{label:"De / Het",sub:"Оберіть артикль",hint:null,items:[
  {nl:"huis",uk:"будинок",art:"het"},{nl:"man",uk:"чоловік",art:"de"},{nl:"vrouw",uk:"жінка",art:"de"},
  {nl:"kind",uk:"дитина",art:"het"},{nl:"tafel",uk:"стіл",art:"de"},{nl:"stoel",uk:"стілець",art:"de"},
  {nl:"boek",uk:"книга",art:"het"},{nl:"auto",uk:"автомобіль",art:"de"},{nl:"water",uk:"вода",art:"het"},
  {nl:"kat",uk:"кіт",art:"de"},{nl:"hond",uk:"собака",art:"de"},{nl:"meisje",uk:"дівчинка",art:"het"},
  {nl:"brood",uk:"хліб",art:"het"},{nl:"fiets",uk:"велосипед",art:"de"},{nl:"school",uk:"школа",art:"de"},{nl:"raam",uk:"вікно",art:"het"}
 ]},
 verbs:{label:"Дієслова",sub:"Перекладіть дієслово",hint:"Дієслово",items:[
  {nl:"zijn",uk:"бути",ex:"Ik ben thuis.",exuk:"Я вдома."},
  {nl:"hebben",uk:"мати",ex:"Ik heb twee kinderen.",exuk:"У мене двоє дітей."},
  {nl:"doen",uk:"робити",ex:"Wat doe je?",exuk:"Що ти робиш?"},
  {nl:"gaan",uk:"іти / їхати",ex:"Ik ga naar school.",exuk:"Я йду до школи."},
  {nl:"komen",uk:"приходити",ex:"Ik kom uit Oekraïne.",exuk:"Я з України."},
  {nl:"zien",uk:"бачити",ex:"Ik zie een kat.",exuk:"Я бачу кота."},
  {nl:"willen",uk:"хотіти",ex:"Ik wil water.",exuk:"Я хочу води."},
  {nl:"wonen",uk:"жити",ex:"Ik woon in België.",exuk:"Я живу в Бельгії."},
  {nl:"werken",uk:"працювати",ex:"Hij werkt veel.",exuk:"Він багато працює."},
  {nl:"spreken",uk:"говорити",ex:"Spreek je Nederlands?",exuk:"Ти говориш нідерландською?"},
  {nl:"kijken",uk:"дивитися",ex:"Ik kijk TV.",exuk:"Я дивлюся телевізор."},
  {nl:"luisteren",uk:"слухати",ex:"Ik luister naar muziek.",exuk:"Я слухаю музику."},
  {nl:"schrijven",uk:"писати",ex:"Hij schrijft een brief.",exuk:"Він пише листа."},
  {nl:"lezen",uk:"читати",ex:"Zij leest een boek.",exuk:"Вона читає книжку."},
  {nl:"kopen",uk:"купувати",ex:"Ik koop brood.",exuk:"Я купую хліб."},
  {nl:"eten",uk:"їсти",ex:"Wij eten appel.",exuk:"Ми їмо яблуко."},
  {nl:"drinken",uk:"пити",ex:"Ik drink koffie.",exuk:"Я п'ю каву."}
 ]},
 colors:{label:"Кольори",sub:"Який це колір?",hint:"Колір",items:[
  {nl:"rood",uk:"червоний",c:"#ef4444"},{nl:"blauw",uk:"синій",c:"#3b82f6"},{nl:"groen",uk:"зелений",c:"#22c55e"},
  {nl:"geel",uk:"жовтий",c:"#eab308"},{nl:"zwart",uk:"чорний",c:"#09090b"},{nl:"wit",uk:"білий",c:"#ffffff"},
  {nl:"oranje",uk:"помаранчевий",c:"#f97316"},{nl:"roze",uk:"рожевий",c:"#ec4899"},{nl:"paars",uk:"фіолетовий",c:"#a855f7"},
  {nl:"grijs",uk:"сірий",c:"#6b7280"},{nl:"bruin",uk:"коричневий",c:"#78350f"}
 ]},
 numbers:{label:"Числа",sub:"Переклад числа",hint:"Число",items:[
  {nl:"een",uk:"1 · один"},{nl:"twee",uk:"2 · два"},{nl:"drie",uk:"3 · три"},{nl:"vier",uk:"4 · чотири"},
  {nl:"vijf",uk:"5 · п’ять"},{nl:"zes",uk:"6 · шість"},{nl:"zeven",uk:"7 · сім"},{nl:"acht",uk:"8 · вісім"},
  {nl:"negen",uk:"9 · дев’ять"},{nl:"tien",uk:"10 · десять"},{nl:"elf",uk:"11 · одинадцять"},
  {nl:"twaalf",uk:"12 · дванадцять"},{nl:"vijftien",uk:"15 · п'ятнадцять"},{nl:"twintig",uk:"20 · двадцять"},
  {nl:"dertig",uk:"30 · тридцять"},{nl:"vijftig",uk:"50 · п'ятдесят"},{nl:"honderd",uk:"100 · сто"},
  {nl:"duizend",uk:"1000 · тисяча"}
 ]},
 seasons:{label:"Пори року та час",sub:"Перекладіть слово",hint:"Час / Пора року",items:[
  {nl:"de lente",uk:"весна",ex:"Het is lente.",exuk:"Зараз весна."},
  {nl:"de zomer",uk:"літо",ex:"In de zomer is het warm.",exuk:"Улітку тепло."},
  {nl:"de herfst",uk:"осінь",ex:"In de herfst regent het.",exuk:"Восени іде дощ."},
  {nl:"de winter",uk:"зима",ex:"In de winter is het koud.",exuk:"Узимку холодно."},
  {nl:"vandaag",uk:"сьогодні",ex:"Vandaag is het maandag.",exuk:"Сьогодні понеділок."},
  {nl:"morgen",uk:"завтра",ex:"Tot morgen!",exuk:"До завтра!"},
  {nl:"gisteren",uk:"вчора",ex:"Gisteren was het zondag.",exuk:"Учора була неділя."}
 ]}
};
var $=function(id){return document.getElementById(id)};
var tab="questions",deck=[],q=0,right=0,round=1,locked=false,item=null,score=0,voice=null;
try{score=parseInt(localStorage.getItem("nl_score")||"0",10)||0}catch(e){}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pickVoice(){var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=v.find(function(x){return /^nl/i.test(x.lang)})||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="nl-NL";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function full(it){return it.art?it.art+" "+it.nl:it.nl}
function spoken(it){return it.ex?(it.say||it.nl)+". "+it.ex:full(it)}

function buildTabs(){
 $("tabs").innerHTML="";
 Object.keys(DATA).forEach(function(k){
  var b=document.createElement("button");b.textContent=DATA[k].label;b.className=k===tab?"on":"";
  b.onclick=function(){tab=k;buildTabs();newRound()};$("tabs").appendChild(b);
 });
}
function newRound(){q=0;right=0;deck=[];next()}
function draw(){if(!deck.length)deck=shuffle(DATA[tab].items);return deck.pop()}

function next(){
 if(q>=PER_ROUND)return end();
 locked=false;item=draw();q++;
 var d=DATA[tab];
 $("prog").textContent="Питання "+q+" з "+PER_ROUND;$("rnd").textContent="Раунд "+round;
 $("barfill").style.width=((q-1)/PER_ROUND*100)+"%";$("score").textContent="⚡ "+score;
 var opts;
 if(tab==="dehet"){opts=["de","het"].map(function(a){return{label:a,ok:a===item.art}})}
 else{
  var others=shuffle(d.items.filter(function(x){return x.uk!==item.uk})).slice(0,3);
  opts=shuffle(others.concat([item])).map(function(x){return{label:x.uk,ok:x===item,c:x.c}});
 }
 $("card").innerHTML='<div class="q"><small>'+d.sub+'</small><h2 lang="nl">'+item.nl+'</h2><p>'+(tab==="dehet"?item.uk:d.hint)+'</p><button class="listen" id="hear">🔊 Слухати</button></div>'+
  '<div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="row"><button class="btn main" id="nx" disabled>Далі</button></div>';
 $("hear").onclick=function(){say(tab==="dehet"?item.nl:item.nl==="welke / welk"?"welke, welk":item.nl)};
 var box=$("opts");
 opts.forEach(function(o){
  var b=document.createElement("button");b.className="opt";
  b.innerHTML=(o.c?'<span class="sw" style="background:'+o.c+'"></span>':"")+"<span></span>";
  b.lastChild.textContent=o.label;b.dataset.ok=o.ok?"1":"";
  b.onclick=function(){answer(o.ok,b)};box.appendChild(b);
 });
}
function answer(ok,btn){
 if(locked)return;locked=true;
 document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.dataset.ok)b.classList.add("ok")});
 if(ok){right++;score+=10;try{localStorage.setItem("nl_score",score)}catch(e){}}else{btn.classList.add("bad")}
 $("score").textContent="⚡ "+score;
 var line=item.ex||full(item),tr=item.exuk||item.uk;
 $("fb").innerHTML='<b lang="nl"></b><p></p>';$("fb").firstChild.textContent=line;$("fb").lastChild.textContent=tr;
 $("nx").disabled=false;$("nx").onclick=next;say(spoken(item));
}
function end(){
 $("barfill").style.width="100%";
 var pct=Math.round(right/PER_ROUND*100);
 $("card").innerHTML='<div class="end"><h2>'+right+' / '+PER_ROUND+'</h2><p>'+pct+'% точність</p><div class="row"><button class="btn main" id="again">Ще раз</button></div></div>';
 round++;$("again").onclick=newRound;
}
buildTabs();newRound();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FC">
<title>Polyglot Leren — Nederlands voor beginners</title>
<style>
:root{
  color-scheme:light;
  --bg:#F7F8FC;--fg:#20243A;--mut:#686F82;--card:#FFFFFF;--line:#E5E8F0;
  --acc:#4657D9;--acc-hover:#3545c4;--ok:#218653;--ok-bg:#EAF7EF;
  --bad:#C43D4B;--bad-bg:#FFF0F1;--soft:#EEF1FF;--shadow:0 8px 30px rgba(32,36,58,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11131A;--fg:#F2F3FA;--mut:#A4A9BA;--card:#1C1F2A;--line:#303443;
  --acc:#8794FF;--acc-hover:#9EA8FF;--ok:#62D493;--ok-bg:#183728;
  --bad:#FF858D;--bad-bg:#3B2027;--soft:#282D4B;--shadow:0 8px 30px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select{font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
button{touch-action:manipulation}
main{width:100%;max-width:760px;margin:0 auto;padding:20px 16px 36px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-size:23px;line-height:1.2;margin:0;letter-spacing:-.04em}
.brand p{margin:0;color:var(--mut);font-size:13px}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.select-group{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:12px}
.lang-select,.theme-btn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;min-height:40px;padding:7px 9px}
.theme-btn{cursor:pointer;min-width:42px}
.score-pill{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.hero{border-radius:20px;padding:20px;background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.hero h2{margin:0 0 4px;font-size:22px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--mut);font-size:14px}
.hero .hero-stat{font-size:13px;color:var(--mut);text-align:right}
.hero .hero-stat strong{display:block;font-size:22px;color:var(--fg)}
nav{display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;padding-bottom:1px}
nav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:11px 12px;color:var(--mut);cursor:pointer;white-space:nowrap;flex-shrink:0;font-size:14px}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc);font-weight:700}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font-size:13px}
.bar{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:-12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;min-width:0}
.q{text-align:center}
.q small{color:var(--mut);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.q h2{font-size:clamp(30px,7vw,42px);font-weight:750;margin:8px 0 3px;letter-spacing:-.04em;overflow-wrap:anywhere}
.q p{margin:0;color:var(--mut);font-size:14px}
.listen{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:24px;padding:9px 15px;font-size:14px;cursor:pointer;margin-top:12px;min-height:42px}
.listen:hover,.btn:hover,.opt:hover:not(:disabled){border-color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:13px;padding:13px 10px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:56px;overflow-wrap:anywhere}
.opt:active{transform:scale(.985)}
.opt.correct{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.opt.incorrect{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.swatch{width:15px;height:15px;border-radius:50%;border:1px solid var(--line);flex-shrink:0}
.feedback{border-radius:13px;min-height:58px;padding:12px;text-align:center;background:var(--bg)}
.feedback:empty{background:transparent}
.feedback strong{display:block;font-size:16px}
.feedback p{margin:3px 0 0;color:var(--mut);font-size:14px}
.feedback .example{margin-top:8px;color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:135px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:650;cursor:pointer;text-align:center;min-height:48px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:white}
.btn.primary:hover{background:var(--acc-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.end{text-align:center;display:flex;flex-direction:column;gap:14px}
.end h2{font-size:42px;margin:0;letter-spacing:-.04em}
.end p{color:var(--mut);margin:0}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.summary-grid div{padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.summary-grid strong{display:block;font-size:20px}
.summary-grid span{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:18px}
footer{text-align:center;color:var(--mut);font-size:12px}
@media(max-width:480px){
 main{padding:15px 12px 28px;gap:14px}
 .brand h1{font-size:20px}
 .top-right{width:100%;justify-content:space-between}
 .hero{padding:16px}
 .card{padding:21px 13px}
 .opts{gap:8px}
 .opt{font-size:14px;padding:12px 7px}
 nav button{padding:10px 9px}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <h1 id="appTitle">Polyglot Leren</h1>
      <p id="tagline">Нідерландська для повсякденного життя</p>
    </div>
    <div class="top-right">
      <label class="select-group"><span id="targetLabel">Вчу</span>
        <select id="targetLangPicker" class="lang-select" aria-label="Мова навчання">
          <option value="nl">🇧🇪 Nederlands</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option>
        </select>
      </label>
      <label class="select-group"><span id="uiLabel">Пояснення</span>
        <select id="uiLangPicker" class="lang-select" aria-label="Мова пояснень">
          <option value="uk">🇺🇦 Українська</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option>
        </select>
      </label>
      <span id="score" class="score-pill" aria-live="polite">⭐ 0</span>
      <button class="theme-btn" id="themeToggle" type="button" aria-label="Змінити тему">🌙</button>
    </div>
  </header>

  <section class="hero">
    <div><h2 id="welcomeTitle">Вчи мову крок за кроком</h2><p id="welcomeText">Короткі уроки, вимова та практичні фрази.</p></div>
    <div class="hero-stat"><span id="progressLabel">Вивчені слова</span><strong id="learnedCount">0</strong><span id="reviewCount">До повторення: 0</span></div>
  </section>

  <nav id="tabs" aria-label="Навчальні теми" role="tablist"></nav>
  <div class="row" id="modeButtons"></div>
  <div class="meta"><span id="prog"></span><span id="rnd"></span></div>
  <div class="bar" role="progressbar" aria-label="Прогрес уроку" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barfill"></i></div>
  <section class="card" id="card" aria-live="polite"></section>
  <footer id="footText">Навчальний тренажер. Прогрес зберігається на цьому пристрої.</footer>
</main>

  ["een","one","un","1 · один"],["twee","two","deux","2 · два"],["drie","three","trois","3 · три"],["vier","four","quatre","4 · чотири"],
  ["vijf","five","cinq","5 · п'ять"],["zes","six","six","6 · шість"],["zeven","seven","sept","7 · сім"],["acht","eight","huit","8 · вісім"],
  ["negen","nine","neuf","9 · дев'ять"],["tien","ten","dix","10 · десять"]
 ].map((x,i)=>({id:"n_"+i,nl:x[0],en:x[1],fr:x[2],uk:x[3]}))},
 seasons:{items:[
  {id:"s_lente",nl:"de lente",en:"spring",fr:"le printemps",uk:"весна",ex_nl:"Het is lente.",ex_en:"It is spring.",ex_fr:"C'est le printemps.",ex_uk:"Зараз весна."},
  {id:"s_zomer",nl:"de zomer",en:"summer",fr:"l'été",uk:"літо",ex_nl:"Het is zomer.",ex_en:"It is summer.",ex_fr:"C'est l'été.",ex_uk:"Зараз літо."},
  {id:"s_herfst",nl:"de herfst",en:"autumn / fall",fr:"l'automne",uk:"осінь",ex_nl:"Het is herfst.",ex_en:"It is autumn.",ex_fr:"C'est l'automne.",ex_uk:"Зараз осінь."},
  {id:"s_winter",nl:"de winter",en:"winter",fr:"l'hiver",uk:"зима",ex_nl:"Het is winter.",ex_en:"It is winter.",ex_fr:"C'est l'hiver.",ex_uk:"Зараз взимку."}
 ]},
 phrases:{items:[
  {id:"p_hallo",nl:"Hallo!",en:"Hello!",fr:"Bonjour !",uk:"Привіт!",ex_nl:"Hallo, hoe gaat het?",ex_en:"Hello, how are you?",ex_fr:"Bonjour, comment ça va ?",ex_uk:"Привіт, як справи?"},
  {id:"p_dank",nl:"Dank je wel.",en:"Thank you.",fr:"Merci.",uk:"Дякую.",ex_nl:"Dank je wel voor je hulp.",ex_en:"Thank you for your help.",ex_fr:"Merci pour ton aide.",ex_uk:"Дякую за допомогу."},
  {id:"p_alstublieft",nl:"Alstublieft.",en:"Please / here you are",fr:"S'il vous plaît",uk:"Будь ласка / ось, тримайте",ex_nl:"Een koffie, alstublieft.",ex_en:"A coffee, please.",ex_fr:"Un café, s'il vous plaît.",ex_uk:"Каву, будь ласка."}
 ]},
 family:{items:[
  {id:"f_gezin",nl:"het gezin",en:"family",fr:"la famille",uk:"сім'я",ex_nl:"Mijn gezin woont in België.",ex_en:"My family lives in Belgium.",ex_fr:"Ma famille habite en Belgique.",ex_uk:"Моя сім'я живе в Бельгії."},
  {id:"f_kind",nl:"het kind",en:"child",fr:"l'enfant",uk:"дитина",ex_nl:"Het kind gaat naar school.",ex_en:"The child goes to school.",ex_fr:"L'enfant va à l'école.",ex_uk:"Дитина ходить до школи."}
 ]},
 shop:{items:[
  {id:"sh_kost",nl:"Hoeveel kost dit?",en:"How much does this cost?",fr:"Combien ça coûte ?",uk:"Скільки це коштує?",ex_nl:"Hoeveel kost dit brood?",ex_en:"How much does this bread cost?",ex_fr:"Combien coûte ce pain ?",ex_uk:"Скільки коштує цей хліб?"},
  {id:"sh_kassa",nl:"Waar is de kassa?",en:"Where is the checkout?",fr:"Où est la caisse ?",uk:"Де каса?",ex_nl:"Waar is de kassa, alstublieft?",ex_en:"Where is the checkout, please?",ex_fr:"Où est la caisse, s'il vous plaît ?",ex_uk:"Де каса, будь ласка?"}
 ]}
};

let targetLang = validStored("poly_target", LANGS, "nl");
let uiLang = validStored("poly_ui", UI_LANGS, "uk");
if (targetLang === uiLang) uiLang = targetLang === "uk" ? "en" : "uk";
let tab = "pronouns", mode = "quiz", deck = [], q = 0, right = 0, round = 1, locked = false, item = null;
let score = loadNumber("poly_score", 0), roundPoints = 0, sessionIds = [];
let store = loadStore();

function validStored(key, allowed, fallback){try{const v=localStorage.getItem(key);return allowed.includes(v)?v:fallback}catch(e){return fallback}}
function loadNumber(key, fallback){try{const n=Number(localStorage.getItem(key));return Number.isFinite(n)&&n>=0?n:fallback}catch(e){return fallback}}
function loadStore(){try{const v=JSON.parse(localStorage.getItem("poly_progress")||"{}");return v&&typeof v==="object"?v:{}}catch(e){return {}}}
function saveStore(){try{localStorage.setItem("poly_progress",JSON.stringify(store));localStorage.setItem("poly_score",String(score));localStorage.setItem("poly_target",targetLang);localStorage.setItem("poly_ui",uiLang)}catch(e){}}
function getUI(){return UI[uiLang]||UI.uk}
function itemsFor(k=tab){return (DATA[k]&&DATA[k].items)||[]}
function labelFor(item,lang=targetLang){return String(item[lang]??item.nl??"")}
function meaningFor(item){return String(item[uiLang]??item.uk??item.nl??"")}
function stateFor(id){if(!store[id])store[id]={seen:0,correct:0,wrong:0,due:0,known:false};return store[id]}
function dueItems(){const now=Date.now();return Object.values(DATA).flatMap(d=>d.items).filter(x=>{const s=stateFor(x.id);return s.seen>0&&!s.known&&s.due<=now})}
function learnedCount(){return Object.values(DATA).flatMap(d=>d.items).filter(x=>stateFor(x.id).known).length}
function updateStats(){$("score").textContent="⭐ "+score;$("learnedCount").textContent=learnedCount();$("reviewCount").textContent=getUI().review+": "+dueItems().length}

function updateHeader(){
 const u=getUI();
 $("appTitle").textContent="Polyglot Leren";
 $("tagline").textContent=u.tagline;
 $("targetLabel").textContent=u.target;
 $("uiLabel").textContent=u.ui;
 $("welcomeTitle").textContent=u.welcome;
 $("welcomeText").textContent=u.welcomeText;
 $("progressLabel").textContent=u.learned;
 $("footText").textContent=u.footer;
 $("targetLangPicker").value=targetLang;
 $("uiLangPicker").value=uiLang;
 document.documentElement.lang=uiLang;
 const isDark=document.documentElement.dataset.theme==="dark";
 $("themeToggle").textContent=isDark?"☀️":"🌙";
 $("themeToggle").title=isDark?u.light:u.dark;
 $("themeToggle").setAttribute("aria-label",isDark?u.light:u.dark);
 updateStats();
 updateModeButtons();
}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function buildTabs(){
 const nav=$("tabs");nav.replaceChildren();const u=getUI();
 Object.keys(DATA).forEach(k=>{
  const b=document.createElement("button");
  b.type="button";
  b.textContent=u.tabs[k]||k;
  b.setAttribute("role","tab");
  b.setAttribute("aria-selected",String(k===tab));
  b.onclick=()=>{tab=k;buildTabs();newRound()};
  nav.appendChild(b);
 });
}

function changeTargetLang(l){if(!LANGS.includes(l))return;targetLang=l;if(targetLang===uiLang)uiLang=targetLang==="en"?"uk":"en";saveStore();updateHeader();buildTabs();newRound()}
function changeUiLang(l){if(!UI_LANGS.includes(l))return;uiLang=l;if(targetLang===uiLang)targetLang=targetLang==="en"?"nl":"en";saveStore();updateHeader();buildTabs();newRound()}

function say(text,lang=targetLang){
 try{
  if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){showSpeechMessage();return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang={nl:"nl-BE",en:"en-GB",fr:"fr-BE"}[lang]||"nl-BE";
  u.rate=.86;
  const voices=window.speechSynthesis.getVoices();
  const prefix=u.lang.toLowerCase().split("-")[0];
  const voice=voices.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(prefix));
  if(voice)u.voice=voice;
  u.onerror=()=>showSpeechMessage();
  window.speechSynthesis.speak(u);
 }catch(e){showSpeechMessage()}
}

function showSpeechMessage(){const fb=$("feedback");if(fb)fb.textContent=getUI().noSpeech}
function updateProgress(){const percent=Math.round(Math.max(0,(q-1)/PER_ROUND)*100);$("barfill").style.width=percent+"%";$("barfill").parentElement.setAttribute("aria-valuenow",String(percent))}

function newRound(){
 q=0;right=0;roundPoints=0;locked=false;sessionIds=[];
 let list=itemsFor();
 if(mode==="review")list=dueItems().filter(x=>itemsFor().some(y=>y.id===x.id));
 if(!list.length){renderEmpty();return}
 deck=shuffle(list);
 nextQuestion();
}

function makeOptions(current){
 if(tab==="dehet"&&targetLang==="nl"){
  return shuffle(["de","het","een"].map(label=>({label,ok:label===current.art_nl})));
 }
 if(tab==="dehet"&&targetLang==="fr"){
  const correct=current.art_fr||"le";
  return shuffle(["le","la","l'"].map(label=>({label,ok:label===correct})));
 }
 const all=itemsFor().filter(x=>x.id!==current.id);
 const correct=labelFor(current);
 const candidates=shuffle(all.filter(x=>labelFor(x)!==correct));
 const chosen=[];const seen=new Set([correct]);
 for(const x of candidates){
   const v=labelFor(x);
   if(!seen.has(v)){seen.add(v);chosen.push({label:v,ok:false,c:x.c});if(chosen.length===3)break}
 }
 chosen.push({label:correct,ok:true,c:current.c});
 return shuffle(chosen);
}

function nextQuestion(){
 if(q>=PER_ROUND||!deck.length){endRound();return}
 locked=false;
 item=deck.pop();
 if(!item){endRound();return}
 q++;
 sessionIds.push(item.id);
 const u=getUI();
 $("prog").textContent=u.lessonProgress+" "+q+" / "+Math.min(PER_ROUND,sessionIds.length+deck.length);
 $("rnd").textContent=u.round+" "+round+" · "+u.modes[mode];
 updateProgress();
 
 const card=$("card");card.replaceChildren();
 const top=document.createElement("div");top.className="q";
 const small=document.createElement("small");small.textContent=(u.subs[tab]||"");top.appendChild(small);
 const h=document.createElement("h2");h.textContent=(mode==="audio"?"🔊":labelFor(item));top.appendChild(h);
 const hint=document.createElement("p");hint.textContent=mode==="study"?u.meaning+": "+meaningFor(item):(u.hints[tab]||"");top.appendChild(hint);
 const hear=document.createElement("button");hear.className="listen";hear.type="button";hear.textContent=u.listen;hear.onclick=()=>say(labelFor(item));top.appendChild(hear);
 card.appendChild(top);

 if(mode==="study"){renderStudyControls(card);return}

 const opts=document.createElement("div");opts.className="opts";opts.id="opts";card.appendChild(opts);
 const feedback=document.createElement("div");feedback.className="feedback";feedback.id="feedback";feedback.setAttribute("aria-live","polite");card.appendChild(feedback);
 const row=document.createElement("div");row.className="row";
 const nx=document.createElement("button");nx.className="btn primary";nx.type="button";nx.disabled=true;nx.textContent=u.next;nx.onclick=nextQuestion;nx.id="nx";
 row.appendChild(nx);card.appendChild(row);

 let options=makeOptions(item);
 options.forEach(o=>{
  const b=document.createElement("button");b.type="button";b.className="opt";b.dataset.ok=o.ok?"1":"";
  if(o.c){const sw=document.createElement("span");sw.className="swatch";sw.style.background=o.c;b.appendChild(sw)}
  const text=document.createElement("span");text.textContent=o.label;b.appendChild(text);
  b.onclick=()=>answer(o.ok,b);opts.appendChild(b);
 });
 if(mode==="audio")say(labelFor(item));
}

function renderStudyControls(card){
 const u=getUI();const fb=document.createElement("div");fb.className="feedback";fb.id="feedback";
 const translation=document.createElement("strong");translation.textContent=meaningFor(item);fb.appendChild(translation);
 if(item["ex_"+targetLang]){const ex=document.createElement("p");ex.className="example";ex.textContent=item["ex_"+targetLang];fb.appendChild(ex)}
 if(item["ex_"+uiLang]){const tr=document.createElement("p");tr.textContent=item["ex_"+uiLang];fb.appendChild(tr)}
 card.appendChild(fb);
 const row=document.createElement("div");row.className="row";
 const hear=document.createElement("button");hear.className="btn";hear.textContent=u.listen;hear.onclick=()=>say(labelFor(item));row.appendChild(hear);
 const known=document.createElement("button");known.className="btn primary";known.textContent=u.markKnown;known.onclick=()=>{const s=stateFor(item.id);s.seen++;s.correct++;s.known=true;s.due=0;saveStore();updateStats();nextQuestion()};row.appendChild(known);
 const review=document.createElement("button");review.className="btn";review.textContent=u.markAgain;review.onclick=()=>{const s=stateFor(item.id);s.seen++;s.known=false;s.due=Date.now()+24*60*60*1000;saveStore();updateStats();nextQuestion()};row.appendChild(review);card.appendChild(row);
}

function answer(ok,btn){
 if(locked)return;locked=true;const u=getUI();const s=stateFor(item.id);s.seen++;
 if(ok){right++;roundPoints+=10;score+=10;s.correct++;s.known=s.correct>=2&&s.wrong===0;s.due=Date.now()+(s.correct>=3?7:1)*24*60*60*1000}
 else{s.wrong++;s.known=false;s.due=Date.now()+24*60*60*1000}
 saveStore();updateStats();
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok==="1")b.classList.add("correct")});
 if(!ok)btn.classList.add("incorrect");
 const fb=$("feedback");fb.replaceChildren();
 const title=document.createElement("strong");title.textContent=ok?u.correct:u.incorrect;fb.appendChild(title);
 if(!ok){const p=document.createElement("p");p.textContent=u.correctWord+" "+labelFor(item);fb.appendChild(p)}
 const meaning=document.createElement("p");meaning.textContent=meaningFor(item);fb.appendChild(meaning);
 const exKey="ex_"+targetLang;if(item[exKey]){const ex=document.createElement("p");ex.className="example";ex.textContent=item[exKey];fb.appendChild(ex)}
 const trKey="ex_"+uiLang;if(item[trKey]){const tr=document.createElement("p");tr.textContent=item[trKey];fb.appendChild(tr)}
 $("nx").disabled=false;say(item[exKey]||labelFor(item));
}

function renderEmpty(){
 const u=getUI();$("prog").textContent="";$("rnd").textContent="";updateProgress();
 const card=$("card");card.replaceChildren();const div=document.createElement("div");div.className="empty";
 div.textContent=mode==="review"?u.emptyReview:u.noItems;card.appendChild(div);
 const row=document.createElement("div");row.className="row";
 const btn=document.createElement("button");btn.className="btn primary";btn.textContent=u.quiz;btn.onclick=()=>{mode="quiz";updateModeButtons();newRound()};row.appendChild(btn);card.appendChild(row);
}

function endRound(){
 const u=getUI();updateProgress();$("barfill").style.width="100%";$("barfill").parentElement.setAttribute("aria-valuenow","100");
 const pct=sessionIds.length?Math.round(right/sessionIds.length*100):0;
 const card=$("card");card.replaceChildren();const end=document.createElement("div");end.className="end";
 const title=document.createElement("h2");title.textContent=mode==="study"?u.finished:right+" / "+sessionIds.length;end.appendChild(title);
 const p=document.createElement("p");p.textContent=mode==="study"?u.finished:pct+"% "+u.accuracy;end.appendChild(p);
 const grid=document.createElement("div");grid.className="summary-grid";
 [[u.right,mode==="study"?"—":right],[u.points,roundPoints],[u.learned,learnedCount()]].forEach(([label,value])=>{const d=document.createElement("div");const strong=document.createElement("strong");strong.textContent=value;const span=document.createElement("span");span.textContent=label;d.append(strong,span);grid.appendChild(d)});end.appendChild(grid);
 const row=document.createElement("div");row.className="row";
 const again=document.createElement("button");again.className="btn";again.textContent=u.again;again.onclick=newRound;row.appendChild(again);
 const review=document.createElement("button");review.className="btn";review.textContent=u.reviewMode;review.onclick=()=>{mode="review";updateModeButtons();newRound()};row.appendChild(review);
 const nextTopic=document.createElement("button");nextTopic.className="btn primary";nextTopic.textContent=u.nextTopic;nextTopic.onclick=()=>{const keys=Object.keys(DATA);tab=keys[(keys.indexOf(tab)+1)%keys.length];buildTabs();mode="quiz";updateModeButtons();newRound()};row.appendChild(nextTopic);
 end.appendChild(row);card.appendChild(end);round++;
}

function updateModeButtons(){
 const u=getUI();const wrap=$("modeButtons");if(!wrap)return;wrap.replaceChildren();
 [["study",u.study],["quiz",u.quiz],["audio",u.audio],["review",u.reviewMode]].forEach(([m,label])=>{
  const b=document.createElement("button");
  b.className="btn"+(m===mode?" primary":"");
  b.type="button";
  b.textContent=label;
  b.onclick=()=>{mode=m;updateModeButtons();newRound()};
  wrap.appendChild(b);
 });
}

$("targetLangPicker").addEventListener("change",e=>changeTargetLang(e.target.value));
$("uiLangPicker").addEventListener("change",e=>changeUiLang(e.target.value));
$("themeToggle").addEventListener("click",()=>{
 const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
 document.documentElement.dataset.theme=next;
 try{localStorage.setItem("poly_theme",next)}catch(e){}
 updateHeader();
});

function start(){
 try{
  const t=localStorage.getItem("poly_theme");
  if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;
  else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";
 }catch(e){}
 updateHeader();
 buildTabs();
 newRound();
}

start();
</script>
</body>
</html>
